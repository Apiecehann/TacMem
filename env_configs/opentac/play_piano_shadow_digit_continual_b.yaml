  \ HEAD 960×662，去掉顶部22像素，u=x/960、v=(y-22)/640，不再次镜像。返回目标字段同 mapped_keys；无效颜色、顺序、工作区或标定会抛错。几何\
  \ press_lift_z_m 不保证接触或达到目标力。\n3. get_hand_state() -> dict：wrist_x_offset_m、wrist_y_m、wrist_z_m（m），index_flexion_rad，wrist_and_index_velocity=[Y速度m/s,Z速度m/s,食指速度rad/s]，arm_joint_position_rad、arm_joint_velocity_rad_s（各7维），visual_key_map_ready。发送目标不代表实际到位；缺值不可补零。\n\
  4. move_shadow_index(wrist_x_offset_m,wrist_y_m,lift_z_m,index_flexion_rad,steps=1)\
  \ -> {ok,steps_executed,native_done}。目标必须有限；X范围[-0.01,0.09]m、Y[-0.32,0.26]m、Z[-0.006,0.05]m、弯指[0,0.50]rad。steps_executed\
  \ 是动作数，一个动作推进4个240Hz物理步。ok 仅表示调用返回。\n   接口实际前置条件：标定后，目标Z<0.035m或弯指>0.05rad的动作要求当前实测XY距目标<=0.002m，且abs(Y速度)<=0.015m/s。检查在步进前执行，失败抛\
  \ ValueError，该次动作未执行；之前已执行动作保留。仅目标Z>=0.035且弯指<=0.05时不检查XY。这是适配器条件，不是音符判分。\n5. wait_steps(steps)\
  \ -> 同上：重复最后目标并推进物理，仍检查相同边界与XY；不冻结机器人、不自动选择姿态。本实验 steps 同样固定为1。\n6. get_index_tactile_rgb()\
  \ -> uint8[H,W,3]：食指当前 DIGIT RGB；无效时可抛错，不返回力或评分。\n7. estimate_key_force(note) ->\
  \ {estimated_key_force_N,sample_step,age_steps,quality,calibration_version}：note\
  \ 为音名/MIDI，只选择黑白键标定，不验证实际碰了哪个键。sample_step/age_steps 单位为动作步。仅 quality=ok、age_steps=0\
  \ 且有限数值可用。no_contact 的力为 None；ood、insufficient_history、invalid_shape、invalid_depth、nonfinite_depth、invalid_color_or_stale、unavailable\
  \ 及未知状态均不可用，不能解释为零力或伪造数值。insufficient_history 表示历史不足，不是OOD；重复读取不增加历史。宿主 reset 已做真实历史预热，原始缺失仍需如实处理。保留校准版本。\n\
  8. finish_piano_note_attempt(index) -> {ok,native_done}：按 request 顺序、每音一次。活动期间必须实测abs(index_flexion_rad)<=0.02rad、abs(wrist_z_m-HOVER_Z)<=0.002m，连续至少0.12物理秒。到位后开始累计，偏离会重置；只发送目标或重复读取不满足条件。提前/重复/乱序提交抛错；此调用不推进物理、不透露评分。原生已终止时不再动作，正常返回给宿主。\n\
  get_note_target、get_key_angles、query_tactile_skill、record_tactile_skill 不可用；没有额外的记忆\
  \ API。\n\n整轮结束反馈：final_note_results 对 A/B 提供同样格式的逐音最终结果，index 对应本轮 request 音序；passed/failed\
  \ 是环境最终通过/未通过，unresolved 表示缺少已结算结果，不得当成失败或成功。available=false 时保持未知。这些结果只在执行结束后用于更新，运行中不能查询。结果不附带原生失败原因、真实力、琴键角度或内部评分过程。\n\
  根据最终结果和本组实际提供的证据，结合当前源码、动作和实际状态总结原因，再提出下一轮可验证的策略调整，包括探针、接近、下压、保持和释放。原因必须由可见证据推断，区分观察和假设；不能因某音失败就断言测力错误或编造真实牛顿数，也不能因一次通过就扩大策略适用范围。\n\
  更新证据边界：A 不接收历史触觉数值、图像、特征，也不接收 quality、OOD、接触标记、公开保持结果或触觉派生的失败原因。A 的 notes 没有 report\
  \ 字段；只能依据源码、任务目标、动作与实测姿态、动作数、姿态释放检查、通用程序错误以及最终逐音结果总结经验。B 额外接收本组逐音触觉报告、估计力历史、质量及算术摘要。缺失反馈不等于未发生接触或传感器正常；不得把假设写成已观测事实。两组都可自行提出控制假设，宿主只校验经验格式，不审查推断内容。两组都不接收真实力和原生失败原因；运行时都使用同一实时测力API。历史窗口由两组相同的动作目标规则选择，不依赖触觉读数。\n\
  \n轮末更新：参考本组当前程序（若提供）、整轮公开反馈和本组累计经验，生成下一轮完整程序与经验。两组运行时同样能测力；缺少数值更新材料时保持未知，不从错误类别猜数值。分清观测、源码事实和假设，不能从\
  \ quality=ok 推断估计完全准确，不能把30Hz窗口当全部60Hz控制或240Hz物理步。反馈的单位、列和缺失标记以字段说明为准。提升完成机会，在不削弱任务要求和边界的前提下改进效率，不得通过提前放弃失败尝试减少动作数。\n\
  experience 首次必须=[]；之后最多16条、8KiB，每项包含 id、conditions、advice、basis（observed或hypothesis），可附\
  \ numeric_correction 和公开来源 evidence。规则可以描述具体控制数值，但新方案仅是待验证假设；下一轮结果可支持或反驳。可按 final_note_results\
  \ 记录逐音最终结果；不得推断其未提供的失败原因或真实力，不推断另一组情况。源码只返回一份，建议控制在9KiB，经验建议约1KiB；完整代码可以重写，不限制为局部补丁。"
shadow_piano_continual_arm: B
