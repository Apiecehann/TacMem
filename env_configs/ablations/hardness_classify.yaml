ablation: true
task: hardness_classify
mode: from_branch_mode_file
model: gpt-6.1-sol
max_tokens: 8192
temperature: 0.2
reasoning_effort: medium
seed_manifest: env_configs/ablations/seeds40.json
assets_manifest: env_configs/ablations/assets.json
task_prompt: 'Control the Franka robot to classify the hardness of the single active
  red block on the table and physically place it on the corresponding plate: soft
  -> blue_plate; hard -> yellow_plate. The other variant is parked outside the reachable
  workspace; there is no reference object or pair of candidates to compare. Finish
  with the block upright on the selected plate. Native evaluation checks placement
  relative to its target: less than 0.04 m error on each horizontal axis, less than
  0.01 m vertically, and upright within approximately 15 degrees. Gripper release
  is not required by these classification tasks. A classification answer alone does
  not complete the task.'
action_contract: 'action(''goto_pose'', position=[x,y,z], quaternion_wxyz=[w,x,y,z]):
  world EE pose, metres; unit quaternion, z >= 0.01. Position-commanded motion, no
  automatic grasp correction.

  action(''gripper'', position=p): normalized opening, 0 closed to 1 open. Fixed position
  command.

  action(''wait'', steps=n): hold existing targets for n native steps (1..120).

  Robot state reports actual EE position, orientation and gripper joint opening.

  '
action_call_budget: 800
process_timeout_s: 7200
env:
  _target_: capx.ablation.environment.BaselineCodeEnv
  cfg:
    config_path: env_configs/ablations/hardness_classify.yaml
    server_url: http://127.0.0.1:8120
    multi_turn_prompt: null
trials: 1
num_workers: 1
record_video: false
