ablation: true
task: grasp_classify
mode: from_branch_mode_file
model: gpt-6.1-sol
max_tokens: 8192
temperature: 0.2
reasoning_effort: medium
seed_manifest: env_configs/ablations/seeds40.json
assets_manifest: env_configs/ablations/assets.json
task_prompt: 'Control the Franka robot to classify the surface of the current prism
  as rough or smooth and physically place it on the corresponding pad: rough -> orange_pad;
  smooth -> green_pad. Native reset has already grasped and lifted the prism. Use
  the initial robot state and scene to assess its current pose. Finish with the prism
  upright on the selected pad, within 0.02 m on each horizontal axis and 0.01 m vertically
  of the native placement target, and upright within approximately 15 degrees. Gripper
  release is not required by the native task. A classification answer alone does not
  complete the task.'
action_contract: 'action(''goto_pose'', position=[x,y,z], quaternion_wxyz=[w,x,y,z]):
  world EE pose, metres; unit quaternion, z >= 0.01. Position-commanded motion, no
  automatic grasp correction.

  action(''gripper'', position=p): normalized opening, 0 closed to 1 open. Fixed position
  command.

  action(''wait'', steps=n): hold existing targets for n native steps (1..120).

  Robot state reports actual EE position, orientation and gripper joint opening.

  '
action_call_budget: 800
process_timeout_s: 7200
env:
  _target_: capx.ablation.environment.BaselineCodeEnv
  cfg:
    config_path: env_configs/ablations/grasp_classify.yaml
    server_url: http://127.0.0.1:8120
    multi_turn_prompt: null
trials: 1
num_workers: 1
record_video: false
