agent0_mode: native
api_servers:
- _target_: capx.serving.launch_univtac_server.main
  device: cuda:0
  headless: true
  host: 127.0.0.1
  kit_args: --/renderer/multiGpu/enabled=false --/renderer/multiGpu/maxGpuCount=1 --/renderer/multiGpu/autoEnable=false
  observation_mode: native
  port: ${oc.decode:${oc.env:UNIVTAC_PORT,8132}}
  python: ${oc.env:CAPX_SIM_PYTHON}
  seed: ${oc.decode:${oc.env:CAPX_TASK_SEED,0}}
  tactile_feature_groups: BS
  task: tactile_memory_match
env:
  _target_: capx.envs.tasks.tactile.univtac_tactile_memory_match.UniVTACTactileMemoryMatchCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    api_functions:
      UniVTACTactileApi:
      - goto_pose
      - move_delta
      - open_gripper
      - close_gripper
      - get_ee_pose
      - get_object_pose
      - sample_grasp_pose
      - rotate_gripper
      - get_tactile_data
    apis:
    - UniVTACTactileApi
    low_level: env_configs/univtac/tactile_memory_match/low_level_tactile_memory_match.yaml
    multi_turn_prompt: ''
    observation_mode: native
    privileged: false
    prompt: "\nYou are controlling a Franka Emika robot with GelSight Mini tactile sensors\non both fingertips.\
      \ The API is described below.\n\nTask: tactile memory matching.  Three identical orange cans (lying\
      \ flat on \nthe table) sit in a line: one REFERENCE can at the back, two CANDIDATE cans \nin front\
      \ of it (candidate_left on the left, candidate_right on the right).  \nA green MATCH SLOT lies beside\
      \ the row. Public pose names (get_object_pose; \nreturns position, quaternion_wxyz, bbox_extent):\
      \ reference_object, \ncandidate_left, candidate_right and match_slot.\n\nPosition GT and grasp coordinates\
      \ for this task:\nget_object_pose(name, return_bbox_extent=True) returns the simulator\nactor's\
      \ world position in metres, quaternion_wxyz, and full bounding-box\ndimensions. It is ground-truth\
      \ geometry, not an image estimate or an\nattribute/class label. For these lying cans the actor origin\
      \ is at the\ncan centre; do not assume the generic bottom-origin description applies.\nget_ee_pose()\
      \ returns the robot wrist-flange world pose. goto_pose takes\nthis wrist pose, not an object centre\
      \ or a fingertip contact point.\n\nFor this task, sample_grasp_pose(name) computes the grasp centre\
      \ from the\ncurrent actor geometry using the native task rule, then converts it to the\nrobot wrist\
      \ target. It returns (position, quaternion_wxyz), ready for goto_pose.\nUse this live query separately\
      \ for reference_object, candidate_left and\ncandidate_right before approaching or re-grasping each\
      \ can. The returned\nposition is already a wrist target: do not add an object offset or convert\
      \ it\nagain. It does not depend on where the hand was on the first query.\nFor match_slot, use get_object_pose\
      \ to plan placement, not sample_grasp_pose.\nRe-query the can after it moves instead of reusing\
      \ a stale grasp target.\n\nThe cans look exactly the same but differ physically in three independent\n\
      ways: 2 surface textures x 2 weights x 2 hardnesses (one rigid, one\ncompliant).  One candidate\
      \ is the reference's \"twin\" (identical in all\nthree); the other differs in at least one of them.\
      \  Your job:\n\n  1. Measure the available property responses of the reference from one progressive\n\
      \     position-commanded grasp, following the one-grasp protocol in the\n     tactile skills at\
      \ the end of this prompt.\n  2. Probe both candidates with the exact same one-grasp protocol.\n\
      \  3. Place on the MATCH SLOT the candidate whose feel is closest to the\n     reference.  Vision\
      \ cannot tell them apart — decide ONLY from tactile\n     data.\n\nKey rules:\n- Every call can\
      \ fail, time out, or be rejected.  Wrap each in try/except and\n  treat a failure as \"this attempt\
      \ missed\", never as the end of your program:\n  a crashed trial scores 0 exactly like a wrong answer.\n\
      - Budget the episode, not the attempt: the whole run has to fit in roughly\n  250 API calls, at\
      \ most 3 grips per can plus one re-grasp.  Every call costs\n  about the same ~10 s whether it moves\
      \ 2 mm or 50 mm, so the count is what\n  costs, not the distance.  Once a can's budget is spent,\
      \ decide with the\n  readings you have — two cans fully read beats three cans half-read.\n- Obtain\
      \ valid protocol readings for the reference and both candidates before\n  deciding.  The skills\
      \ below say what makes a reading valid, what a missed\n  approach costs, and which candidate the\
      \ readings do and do not identify.\n\nComparison and fallback for this evaluation:\nComplete the\
      \ reference and candidate probes before selecting a candidate.\nCompare the valid measured responses\
      \ under the same probing protocol, using\nonly the available channels and compatible skill rules.\
      \ Use this comparison\nto choose the candidate best supported by the reference measurements.\nAn\
      \ unavailable property is UNKNOWN and is omitted from the comparison;\nit is not a mismatch, and\
      \ does not invalidate the other measured properties.\nIf the remaining measured properties distinguish\
      \ the candidates, use that\nevidence to select. Do not discard it merely because another property\
      \ is\nunavailable. Do not select randomly before probing or collect measurements\nwithout using\
      \ them in the final candidate decision.\nOnly when the remaining valid evidence cannot distinguish\
      \ the candidates,\nor no valid evidence can be obtained within the existing budget, choose\nuniformly\
      \ at random among the candidates that remain possible. Make the\nfinal selection once after comparison\
      \ and retain it through placement.\nPhysically attempt the selected candidate's grasp, transport\
      \ and placement.\nDo not invent observations, labels or calibration values. Respect native\ntermination,\
      \ motion limits and the existing execution budget.\nThis available-evidence comparison takes precedence\
      \ over any requirement\nabove to measure every property or obtain a complete set of readings.\n\n\
      Experimental execution contract:\nUse only functions and per-side scalar fields documented for this\
      \ configuration.\nSkills referring to unavailable helpers do not register those helpers: implement\n\
      any retained comparison with the documented primitive actions and observations.\nKeep unavailable\
      \ or invalid measurements unknown; never replace them with zeros\nor invent a calibrated conversion.\
      \ Do not stop solely because an attribute is\nunavailable. Make a bounded physical attempt using\
      \ the observations that remain.\nThe task requirements and native termination still apply. An ended\
      \ episode means\nno further motion or gripper calls, including an otherwise planned retreat.\nReturn\
      \ one complete executable Python program; no subsequent regeneration occurs.\n\nAvailable per-side\
      \ scalar fields (left_/right_ prefixes):\ncontact, depth_mm, marker_displacement_px, marker_anisotropy,\
      \ height_roughness_mm.\nReadings include physical step and time where reported. Missing channels\
      \ remain\nunknown on tasks that do not supply them. Raw sensor\narrays and unlisted derived estimates\
      \ are not available. Native actuator control\nis identical across groups; commanded controller targets\
      \ are not sensor readings.\nWrite ONLY executable Python code (no code fences). Import numpy if\
      \ needed.\n"
    tactile_feature_groups: BS
    tactile_skill_root: env_configs/ablations/tactile_features/skills/bs
    tactile_skills:
    - reflex-stop-on-events
    - descent-until-contact
    - one-call-approach
    - world-frame-transport
    - lift-before-lateral
    - seat-height-from-plate
    - descend-until-supported
    - unload-before-open
    - settle-after-release
    - keep-closed-if-task-allows
    - differential-across-states
    - one-grasp-multi-property
    - no-absolute-without-reference
    - readability-not-identity
    - tactile-cannot-locate
    - grasp-verification
    - channel-selection
    - memory-match-one-grasp
    - depth-grip-scale
    - gel-shear-weight
    - position-mode-for-yield
    - finger-position-grip
    - can-texture-difference
    - shear-vs-displacement
    - slip-pair-baseline
    - contact-flag-is-range
    - follow-is-signal
    - close-lands-on-target
    - no-calibration-transfer
exec_alarm_seconds: 2400
max_tokens: 8192
model: gpt-6-astra
num_workers: 1
output_dir: ${oc.env:CAPX_ABLATION_OUTPUT_DIR}/bs
process_timeout_seconds: 4200
reasoning_effort: high
record_video: true
resume_idx: ${oc.decode:${oc.env:CAPX_TASK_SEED,0}}
seed_manifest: env_configs/ablations/tactile_features/seeds30.json
server_url: ${oc.env:CAPX_MODEL_URL,http://127.0.0.1:8110/responses}
task_name: tactile_memory_match
temperature: 1.0
trial_timeout_seconds: 3600
trials: ${oc.decode:${oc.env:CAPX_TASK_SEED,0}}
use_img_differencing: false
use_multimodel: false
use_oracle_code: false
use_parallel_ensemble: false
use_video_differencing: false
use_visual_feedback: true
use_wrist_camera: false
