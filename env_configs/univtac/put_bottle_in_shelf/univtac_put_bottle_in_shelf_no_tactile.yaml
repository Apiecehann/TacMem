# UniVTAC: put_bottle_in_shelf (no-tactile ablation, single-turn)
# Usage: uv run capx/envs/launch.py --config-path env_configs/univtac/put_bottle_in_shelf/univtac_put_bottle_in_shelf_no_tactile.yaml

env:
  _target_: capx.envs.tasks.tactile.univtac_put_bottle_in_shelf.UniVTACPutBottleInShelfCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/put_bottle_in_shelf/low_level_put_bottle_in_shelf.yaml
    privileged: false
    apis:
      - UniVTACMotionApi
api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: put_bottle_in_shelf
    port: 8120
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_put_bottle_in_shelf_no_tactile

trials: 100
num_workers: 1
