env:
  _target_: capx.envs.tasks.tactile.univtac_weight_classify.UniVTACWeightClassifyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/weight_classify/low_level_weight_classify.yaml
    privileged: false
    apis:
    - UniVTACTactileApi
    api_functions:
      UniVTACTactileApi:
      - goto_pose
      - move_delta
      - open_gripper
      - close_gripper
      - get_ee_pose
      - get_object_pose
      - sample_grasp_pose
      - rotate_gripper
      - get_tactile_data
      - get_tactile_image
      - get_tactile_depth
    multi_turn_prompt: ''
    prompt: |

      You are controlling a Franka Emika robot with GelSight Mini tactile sensors
      on both fingertips. The API is described below.

      Goal: exactly ONE block is standing on the table. Decide by touch whether it is
      light or heavy, then place it on the matching plate:
        - Light block -> the blue_plate
        - Heavy block -> the yellow_plate

      In the scene the block is named "block" and the plates "blue_plate" and
      "yellow_plate" - use those exact names with the pose and grasp helpers.

      The catch: the other block is parked a metre away, out of reach, so there is no
      reference object to compare against. The reading has to be absolute, taken the
      same way every trial.

      Your fingertips are the instrument: the weight is in the gel, not in how far
      anything moved, and a single raw reading means nothing on its own.

      After classifying, carry the block to its plate. The placement recipe - how to
      move a held block, where to stop, and whether to let go - is in those same
      skills. This task is scored on where the block ends up: seat it on the right
      plate, upright, and stop.

      Final placement: within 4 cm horizontally and 1 cm vertically, upright within 15
      degrees.

      Classification fallback for this evaluation:
      Use only the documented APIs and observations actually available. If the
      available observations cannot identify the class or matching candidate,
      choose uniformly at random between the two valid alternatives:
        light -> blue_plate or heavy -> yellow_plate.
      Make that fallback choice once and keep it through the placement attempt.
      Physically attempt the corresponding grasp, transport and placement;
      do not return without acting solely because identification is uncertain.
      This fallback overrides the touch-only and valid-reading requirements
      above when the required observations are unavailable or inconclusive.
      Do not invent observations, labels or calibration values. Respect native
      termination, motion limits and the existing execution budget.

      Raw tactile analysis for this evaluation:
      The available tactile inputs are raw RGB, RGB with markers and complete
      depth arrays. The skill library supplies no calibrated class thresholds
      or force-conversion models; do not wait for those values.
      In the single generated program, use NumPy, OpenCV (cv2), or equivalent
      array/image operations to analyse the available raw signals and attempt
      a task-relevant judgement. Use the analysis result in classification,
      matching or manipulation decisions; merely reading and storing arrays
      does not satisfy this requirement.
      For classification or matching, attempt bounded sampling and analysis
      before selecting a class or candidate. Do not choose randomly before
      analysing the available signals. If usable signals cannot be acquired
      within the execution budget, or analysis remains inconclusive, use the
      existing classification fallback. This analysis-before-fallback order
      takes precedence over the fallback wording above.
      Do not invent observations, calibrated values or physical measurements.
      Preserve the native task goal, termination, motion limits and budget.

      Write ONLY executable Python code (no code fences). Import numpy if needed.
    observation_mode: raw
    tactile_skills:
    - public-pose-queries
    - one-call-approach
    - lift-before-lateral
    - world-frame-transport
    - seat-height-from-plate
    - settle-after-release
    - keep-closed-if-task-allows
    - finger-position-grip
    - differential-across-states
    - grasp-verification
    - tactile-cannot-locate
    - no-calibration-transfer
    - gel-shear-weight
    - one-grasp-multi-property
    - readability-not-identity
agent0_mode: raw
task_name: weight_classify
seed_manifest: env_configs/ablations/seeds30.json
model: gpt-6-astra
reasoning_effort: high
max_tokens: 8192
temperature: 1.0
server_url: ${oc.env:CAPX_MODEL_URL,http://127.0.0.1:8110/responses}
api_servers:
- _target_: capx.serving.launch_univtac_server.main
  python: /mnt/data/ljz/opentacbench/conda-envs/UniVTAC/bin/python
  task: weight_classify
  port: 8120
  host: 127.0.0.1
  observation_mode: raw
  seed: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
  headless: true
  device: cuda:0
  kit_args: --/renderer/multiGpu/enabled=false --/renderer/multiGpu/maxGpuCount=1 --/renderer/multiGpu/autoEnable=false
record_video: true
use_visual_feedback: true
use_wrist_camera: false
use_img_differencing: false
use_video_differencing: false
use_oracle_code: false
use_parallel_ensemble: false
use_multimodel: false
exec_alarm_seconds: 1200
trial_timeout_seconds: 1800
process_timeout_seconds: 2400
output_dir: /mnt/data/ljz/opentacbench/cap-agent0-baselines/raw_tactile
trials: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
resume_idx: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
num_workers: 1
