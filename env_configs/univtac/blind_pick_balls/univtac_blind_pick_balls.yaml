env:
  _target_: capx.envs.tasks.tactile.univtac_blind_pick_balls.UniVTACBlindPickBallsCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/blind_pick_balls/low_level_blind_pick_balls.yaml
    privileged: false
    apis:
    - UniVTACBallApi
    api_functions:
      UniVTACBallApi:
      - goto_pose
      - move_delta
      - open_gripper
      - close_gripper
      - get_ee_pose
    prompt: 'You control a Franka robot through the documented native API. Use allowed position and robot-state
      queries and ordinary scene vision. Use only documented functions; do not read task internals, files, hidden
      labels or private evaluation endpoints. Gripper closing is position-controlled. Write one complete Python
      program and call its entry function, without Markdown fences or prose. Only one generation is available: loops
      and recoverable error handling must be inside that program. Do not continue after native termination. The
      host evaluates native completion after the program returns; code execution success is separate from task success.


      Task: Take one textured ball out of a box and release it into the bowl. The box contains twelve balls: four
      hard, four soft and four textured. Their individual positions and material labels are hidden; there is no
      scene camera view inside the box. You may query the robot end-effector pose. The box interior is 0.36 m along
      x by 0.48 m along y, centred at (0.51, 0.00); rim z=0.19 m, floor z=0.016 m. Ball base radius is 0.03 m; resting
      centres are approximately z=0.050 m, on rows y=-0.115, 0.000, 0.115 m. Bowl centre is (0.49, -0.34), radius
      0.075 m, wall top z=0.051 m. A ball counts only if actually held and lifted clear of the box, then resting
      inside the bowl. A wrong-kind ball delivered to the bowl ends the episode. The native physical episode budget
      is about four minutes.


      Use only ordinary scene vision, robot state, allowed position queries and action execution status. No fingertip
      sensor observations or sensor-derived judgments are available. Do not request or infer access to undocumented
      sensing interfaces. Task targets remain goals, not observations.'
    observation_mode: none
    tactile_skills:
    - lift-before-lateral
    - world-frame-transport
    - cruise-height
    - settle-after-release
    - pass-ball-with-wide-pads
    - reach-band-at-ball-height
    - bowl-descent-stops-short
    - search-continues-after-miss
    - finger-position-grip
    multi_turn_prompt: ''
agent0_mode: none
task_name: blind_pick_balls
seed_manifest: env_configs/ablations/seeds40.json
model: gpt-6.1-sol
max_tokens: 8192
temperature: 1.0
server_url: ${oc.env:CAPX_MODEL_URL,http://127.0.0.1:8110/responses}
api_servers:
- _target_: capx.serving.launch_univtac_server.main
  python: /mnt/data/ljz/opentacbench/conda-envs/UniVTAC/bin/python
  task: blind_pick_balls
  port: 8120
  host: 127.0.0.1
  observation_mode: none
  seed: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
  headless: true
  device: cuda:0
  kit_args: --/renderer/multiGpu/enabled=false --/renderer/multiGpu/maxGpuCount=1 --/renderer/multiGpu/autoEnable=false
record_video: true
use_visual_feedback: true
use_wrist_camera: false
use_img_differencing: false
use_video_differencing: false
use_oracle_code: false
use_parallel_ensemble: false
use_multimodel: false
exec_alarm_seconds: 1200
trial_timeout_seconds: 1800
process_timeout_seconds: 2400
output_dir: /mnt/data/ljz/opentacbench/cap-agent0-baselines/no_tactile
trials: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
resume_idx: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
num_workers: 1
