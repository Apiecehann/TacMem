env:
  _target_: capx.envs.tasks.base.CodeExecutionEnvBase
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.tasks.tactile.low_level.UniVTACStubEnv
      task_name: tension_strap
    privileged: false
    apis:
    - UniVTACTactileApi
    api_functions:
      UniVTACTactileApi:
      - goto_pose
      - move_delta
      - open_gripper
      - close_gripper
      - get_ee_pose
      - get_object_pose
      - sample_grasp_pose
      - rotate_gripper
      - submit_episode
    append_final_check: submit_episode
    multi_turn_prompt: ''
    prompt: |

      You are controlling a Franka Emika robot with GelSight Mini tactile sensors
      on both fingertips. The API is described below.

      Goal: execute this episode's two-stage force and time request: {force_request}.
      The force_time_sequence field is [first force in newtons, first hold in seconds,
      second force in newtons, second hold in seconds]. Complete the stages in that
      order. Each hold counts only while the force stays continuously within half
      a newton of its target. The strap is called "elastic_strap".

      Before this program starts, initialization opens the gripper and moves it
      above the strap handle, then down to the handle grasp pose. The actual pose
      is checked before handoff. The gripper is still open: begin by closing it
      with the documented position-control API. Do not repeat the initial approach.
      The preparation has not closed the gripper or issued a pulling action.

      The simulation advances only while the hand is being commanded; waiting passes
      no time at all, so a hold is made of commands.

      Judge the elastic strap tension yourself using the available observations and APIs.

      Infer the tension yourself and attempt both requested force-and-time stages.
      Do not stop, return early, or raise an exception solely because a calibrated
      force estimate, conversion formula, or known-force reference is unavailable.
      Make your best attempt using the observations and APIs available to you.
      Continue to respect native termination, action limits, and execution budgets.

      The strap is elastic, so the load is set by where the hand is and by nothing
      else - the pull raises it and backing off lowers it by as much. There is no
      second lever and nothing to press against, and nothing is scored on arriving:
      the score is the two holds.

      Write ONLY executable Python code (no code fences). Import numpy if needed.

    observation_mode: none
    tactile_skills:
    - one-call-approach
    - world-frame-transport
    - preserve-existing-grasp
    - finger-position-grip
agent0_mode: none
task_name: tension_strap
seed_manifest: env_configs/ablations/seeds30_tension.json
model: gpt-6-astra
reasoning_effort: high
max_tokens: 8192
temperature: 1.0
server_url: ${oc.env:CAPX_MODEL_URL,http://127.0.0.1:8110/responses}
api_servers:
- _target_: capx.serving.launch_univtac_server.main
  python: ${oc.env:CAPX_SIM_PYTHON,/mnt/data/ljz/opentacbench/conda-envs/UniVTAC/bin/python}
  task: tension_strap
  port: 8120
  host: 127.0.0.1
  observation_mode: none
  seed: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
  headless: true
  device: cuda:0
  kit_args: --/renderer/multiGpu/enabled=false --/renderer/multiGpu/maxGpuCount=1 --/renderer/multiGpu/autoEnable=false
record_video: true
use_visual_feedback: true
use_wrist_camera: false
use_img_differencing: false
use_video_differencing: false
use_oracle_code: false
use_parallel_ensemble: false
use_multimodel: false
exec_alarm_seconds: 1800
trial_timeout_seconds: 1800
process_timeout_seconds: 1800
output_dir: ${oc.env:CAPX_OUTPUT_ROOT,/mnt/data/ljz/opentacbench/cap-agent0-baselines}/no_tactile
trials: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
resume_idx: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
num_workers: 1
