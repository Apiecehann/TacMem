# UniVTAC: tactile_transfer_rearrange_clean (no-tactile ablation, single-turn)
# Usage: uv run capx/envs/launch.py --config-path env_configs/univtac/tactile_transfer_rearrange_clean/univtac_tactile_transfer_rearrange_clean_no_tactile.yaml

env:
  _target_: capx.envs.tasks.tactile.univtac_tactile_transfer.UniVTACTactileTransferCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/tactile_transfer_rearrange_clean/low_level_tactile_transfer_rearrange_clean.yaml
    privileged: false
    apis:
      - UniVTACMotionApi
api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: tactile_transfer_rearrange_clean
    port: 8120
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_tactile_transfer_rearrange_clean_no_tactile

trials: 100
num_workers: 1
