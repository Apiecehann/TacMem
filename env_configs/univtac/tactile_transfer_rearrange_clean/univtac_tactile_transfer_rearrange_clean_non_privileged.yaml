# UniVTAC: tactile_transfer_rearrange_clean (non-privileged / perception)
# Object poses come from SAM3 text-prompt segmentation + metric depth
# back-projection (UniVTACPerceptionApi) instead of the simulator's
# ground-truth /object_pose endpoint.
#
# Scene visual facts (verified empirically on 2026-08-31):
#   - Head camera sees only ONE orange can: object_b sits inside a recessed
#     compartment hidden behind a white occlusion wall (visual-only, no
#     physics).  Every "can" phrase from head returns object_a.
#   - object_b is located in two steps: head "white wall" -> wall centre
#     (compartment), move the gripper above it, then wrist camera
#     "orange can" -> the hidden can's top.
#   - The two green pads are identical; SAM3 returns only the top-1
#     instance, so "green pad" may hand back a single pad.
#   - sample_grasp_pose takes the simulator prim name ("object_a"),
#     never a perception phrase (404).
#
# Servers are started manually (Isaac's main() cannot take kwargs, so the
# runner's spawn path fails — see _start_api_servers):
#   bash scripts/launch_sam3_server.sh 1 8114     # SAM3 (GPU 1; GPU 0 = Isaac)
#   bash scripts/launch_univtac_server.sh tactile_transfer_rearrange_clean 8120 0 <seed>
# Usage: uv run --offline capx/envs/launch.py --config-path env_configs/univtac/tactile_transfer_rearrange_clean/univtac_tactile_transfer_rearrange_clean_non_privileged.yaml

env:
  _target_: capx.envs.tasks.tactile.univtac_tactile_transfer.UniVTACTactileTransferCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/tactile_transfer_rearrange_clean/low_level_tactile_transfer_rearrange_clean.yaml
    privileged: false
    apis:
      - UniVTACPerceptionApi

    prompt: |
      You are controlling a Franka Emika robot with GelSight Mini tactile sensors
      on both fingertips. The API is described below.

      Goal: move two objects into their slots, strictly in order:
        1. Pick up object_a and place it into slot_a.
        2. Pick up object_b and place it into slot_b.
      Both objects must end up resting in their slots for the task to succeed.

      Object poses come from SAM3 visual perception, not the simulator:
      get_object_pose() returns the centroid of the segmented pixels — a
      noisy estimate (a few mm), NOT the exact origin, and the quaternion
      is unreliable. Treat every position as an estimate; never
      over-correct from it.

      Localization (head camera by default):
      - object_a is the ONLY orange can visible from the head camera — the
        second can (object_b) sits inside a recessed compartment hidden
        behind a white occlusion wall. "orange can" from head always
        returns object_a.
      - Locate object_b in two steps: query "white wall" from the head
        camera — the wall centre marks the compartment. Move the gripper
        above that spot, then query get_object_pose("orange can",
        camera="wrist"): from directly above, the wrist camera sees the
        hidden can's top.
      - The two slots are identical green pads and "green pad" may return
        only one of them; slot_b is the open pad beside the white-walled
        compartment.
      - sample_grasp_pose takes the simulator prim name ("object_a",
        "object_b") — never pass a perception phrase like "orange can"
        (it returns a 404).

      Key rules:
      - Perception is heuristic: a query can return garbage (e.g. the
        robot arm segmented as the queried object) or raise when the view
        is bad.  Cross-check readings against the layout, and wrap
        critical queries in try/except with a fixed-layout fallback
        instead of trusting a single reading.
      - Work on object_a first.  Touching object_b before object_a is
        released in slot_a fails the task.
      - sample_grasp_pose is reliable only for object_a (it has not moved
        since reset).  For object_b, build the grasp pose from the
        perceived position plus the grasp offset measured on object_a
        (grasp_pos = object_pos + offset).
      - Verify every placement: descend in small steps until the held
        object's perceived height stops falling, then open the gripper —
        never release from a height, never keep pressing.

      Write ONLY executable Python code (no code fences). Import numpy if needed.

    # Reference non-privileged solution.  Absolute heights are unreliable
    # (noisy centroid), so placement is judged by motion (height stops
    # falling) with a depth-budget fallback; object_b is found in two
    # steps (head finds the wall, wrist finds the can); the slots come
    # from the fixed layout because SAM3 returns only the top-1 pad.
    oracle_code: |
      import numpy as np

      # ---- Non-privileged oracle ----
      # get_object_pose() returns the SAM3 centroid (median of the
      # back-projected pixels): noisy (a few mm), not the prim origin,
      # quaternion unreliable.  Head camera sees only object_a — object_b
      # is hidden behind the white occlusion wall, so it is located in
      # two steps: head "white wall" -> compartment, then wrist camera
      # "orange can" -> the can top from directly above.
      #
      # Fixed layout used as priors (same kind of prior as the privileged
      # oracle's RELEASE_Z):
      #   object_a: open table (~[0.68, 0.26]);  walled compartment
      #   ~[0.566, -0.24];  slot_a: [0.42, +0.16];  slot_b: [0.42, -0.16]
      #   (both green pads, top at z = 0.011).
      #   Can: 4 cm diameter, origin at centre, resting centre z = 0.021,
      #   can top = centre + 0.02 (radius).

      SLOT_A_XY = np.array([0.42, 0.16])
      SLOT_B_XY = np.array([0.42, -0.16])
      SLOT_Z = 0.011       # green pad top
      CAN_RADIUS = 0.02
      WALL_XY = np.array([0.566, -0.24])   # fallback for "white wall" query

      def contacts_ok(fb):
          return fb["left_contact"] and fb["right_contact"]

      def grasp_at(grasp_pos, quat, z_approach=0.05, retries=4):
          """Approach and close with a tactile fallback: descend a few mm
          and retry while the fingers did not contact anything."""
          goto_pose(np.asarray(grasp_pos, dtype=float), quat,
                    z_approach=z_approach)
          fb = close_gripper()
          for _ in range(retries):
              if contacts_ok(fb):
                  return True
              open_gripper()
              move_delta(dz=-0.003)
              fb = close_gripper()
          return contacts_ok(fb)

      def place_into_slot(held_phrase, slot_xy, quat, offset_xy, offset_z,
                          fixed_steps=None):
          """Carry the held object over the slot and release it there.

          With fixed_steps=None, descend in small steps until the held
          object's perceived height stops falling (z-stall) — only valid
          while the held can is the sole visible can (object_a's
          placement; object_b is still hidden behind the wall).  With a
          fixed budget (object_b's placement — the held can then competes
          with object_a for the SAM3 top-1 mask, so height monitoring is
          unreliable): ~8 cm from hover to resting, 30 steps x 3 mm.
          """
          hover_ee = np.array([slot_xy[0] + offset_xy[0],
                               slot_xy[1] + offset_xy[1],
                               SLOT_Z + offset_z + 0.10])
          goto_pose(hover_ee, quat, z_approach=0.05)
          if fixed_steps is not None:
              for _ in range(fixed_steps):
                  move_delta(dz=-0.003)
          else:
              last, stall = None, 0
              for _ in range(30):
                  move_delta(dz=-0.003)
                  try:
                      z = get_object_pose(held_phrase)[0][2]
                  except Exception:
                      continue  # occluded view — keep to the depth budget
                  if last is not None and z > last - 0.002:
                      stall += 1
                      if stall >= 3:
                          break
                  else:
                      stall = 0
                  last = z
          open_gripper()
          move_delta(dz=0.08)

      # ---- Stage 1: perceive (head camera) ----
      pos_a, _, _ = get_object_pose("orange can")   # the only visible can
      try:
          wall, _, _ = get_object_pose("white wall")  # occlusion wall
          wall_xy = np.asarray(wall[:2], dtype=float)
      except Exception:
          wall_xy = WALL_XY
      print(f"object_a (head): {np.round(pos_a, 3)}; wall: {np.round(wall_xy, 3)}")

      # ---- Stage 2: object_a -> slot_a ----
      # sample_grasp_pose needs the simulator prim name, not a phrase.
      grasp_a, quat_a = sample_grasp_pose("object_a")
      ok_a = grasp_at(grasp_a, quat_a)
      offset = np.asarray(grasp_a, dtype=float) - pos_a  # EE-to-centre, reused for b
      print(f"grasp object_a ok={ok_a} offset={np.round(offset, 3)}")
      move_delta(dz=0.10)
      place_into_slot("orange can", SLOT_A_XY, quat_a, offset[:2], offset[2])

      # ---- Stage 3: object_b (hidden behind the wall) ----
      goto_pose(np.array([wall_xy[0], wall_xy[1], 0.20]), quat_a, z_approach=0.0)
      pos_b, _, _ = get_object_pose("orange can", camera="wrist")  # can top
      centre_b = np.array([pos_b[0], pos_b[1], pos_b[2] - CAN_RADIUS])
      grasp_b = centre_b + offset
      ok_b = grasp_at(grasp_b, quat_a)
      print(f"object_b (wrist): top={np.round(pos_b, 3)} "
            f"centre={np.round(centre_b, 3)} ok={ok_b}")
      move_delta(dz=0.16)  # lift clear above the 0.18 wall (visual-only)
      place_into_slot("orange can", SLOT_B_XY, quat_a, offset[:2], offset[2],
                      fixed_steps=30)

      # ---- Verify ----
      success = check_success()
      print(f"Success: {success}")

api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: tactile_transfer_rearrange_clean
    port: 8120
    host: 127.0.0.1

  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_tactile_transfer_rearrange_clean_non_privileged

trials: 100
num_workers: 1  # Isaac Sim is not parallel-safe
