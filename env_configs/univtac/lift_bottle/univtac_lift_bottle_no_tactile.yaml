# UniVTAC: lift_bottle (no-tactile ablation, single-turn)
# Usage: uv run capx/envs/launch.py --config-path env_configs/univtac/lift_bottle/univtac_lift_bottle_no_tactile.yaml

env:
  _target_: capx.envs.tasks.tactile.univtac_lift_bottle.UniVTACLiftBottleCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/lift_bottle/low_level_lift_bottle.yaml
    privileged: false
    apis:
      - UniVTACMotionApi
api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: lift_bottle
    port: 8120
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/univtac_lift_bottle_no_tactile

trials: 100
num_workers: 1
