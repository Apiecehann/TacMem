# UniVTAC: lift_bottle (multi-turn + VDM + tactile)
env:
  _target_: capx.envs.tasks.tactile.univtac_lift_bottle.UniVTACLiftBottleCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/lift_bottle/low_level_lift_bottle.yaml
    privileged: false
    apis:
      - UniVTACTactileApi

    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Do NOT compute quaternions or rotation matrices manually — use rotate_gripper(), goto_pose(), or move_delta() instead.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' if the task appears to be complete

api_servers:
  - _target_: capx.serving.launch_univtac_server.main
    task: lift_bottle
    port: 8120
    host: 127.0.0.1

record_video: true
use_img_differencing: true
output_dir: ./outputs/univtac_lift_bottle_multiturn_vdm

trials: 100
save_multiturn_prompts: true
num_workers: 1
use_legacy_multi_turn_decision_prompt: true
