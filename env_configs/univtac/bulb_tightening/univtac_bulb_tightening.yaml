env:
  _target_: capx.envs.tasks.tactile.univtac_bulb_tightening.UniVTACBulbTighteningCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: env_configs/univtac/bulb_tightening/low_level_bulb_tightening.yaml
    privileged: false
    apis:
    - UniVTACTactileApi
    api_functions:
      UniVTACTactileApi:
      - goto_pose
      - move_delta
      - open_gripper
      - close_gripper
      - get_ee_pose
      - get_object_pose
      - sample_grasp_pose
      - rotate_gripper
    prompt: |

      You are controlling a Franka Emika robot with GelSight Mini tactile sensors
      on both fingertips. The API is described below.

      Goal: screw the light_bulb into its socket until it is all the way in. In the
      scene the bulb is named "light_bulb" - use that exact name with the pose and
      grasp helpers.

      The bulb starts already threaded into its socket, and it is a thread: turning
      is the only thing that takes it deeper. Pushing it down does not move it - the
      push is taken by the glass and the pads instead, and it stays there.

      The fingertips are the instrument, not a safety net. The bulb is smooth glass
      and the pads are the only thing that touches it, so every question this task
      asks is answerable from them, and that is where the answers should come from:

      - Which way is in. Compare the available observations from separate
        rotation attempts to judge the tightening direction.
      - How fast to descend. The lead is not given and varies with the bulb;
        attempt to infer it from the available observations.
      - Whether it is in. Judge seating from available evidence rather than
        assuming that a fixed number of turns proves completion.

      The wrist runs out of range soon after a third of a turn, so a full insertion
      is several segments with the hand re-set in between. Going past that range is
      refused outright and is not recoverable within the episode, so keep the
      segments well short of it; the skills below give the reset sequence and say
      when to stop re-setting.

      The job is done the moment the bulb is all the way in: there is nothing to
      submit and nothing to hold at the end, so stop turning there and let the
      episode be scored on the bulb.

      No-tactile experimental condition:
      This run intentionally provides no tactile interfaces or observations.
      Their absence is not a setup error and does not need to be fixed.
      For this condition, the tactile-reading prerequisites and touch-only
      sensing instructions above do not apply. Do not wait for tactile
      verification before attempting the task.
      Write one complete executable program that physically attempts the
      original task using only the listed APIs, available scene images,
      permitted pose information and the provided non-tactile skills.
      Do not request additional sensors or interfaces, raise an exception,
      or return without attempting actions solely because tactile feedback
      is unavailable or task success cannot be guaranteed.
      When a classification fallback is specified above, follow that rule.
      Otherwise choose a best-effort action plan from the available information.
      Do not invent sensor readings, calibration values, hidden object positions
      or property labels. Keep the original task goal, native termination,
      motion limits and execution budget; the environment judges the outcome.

      Write ONLY executable Python code (no code fences). Import numpy if needed.
    observation_mode: none
    tactile_skills:
    - public-pose-queries
    - bulb-grasp-pose
    - feed-must-match-lead
    - wrist-limit-segmentation
    - preserve-existing-grasp
    multi_turn_prompt: ''
agent0_mode: none
task_name: bulb_tightening
seed_manifest: env_configs/ablations/seeds30.json
model: gpt-6-astra
reasoning_effort: high
max_tokens: 8192
temperature: 1.0
server_url: ${oc.env:CAPX_MODEL_URL,http://127.0.0.1:8110/responses}
api_servers:
- _target_: capx.serving.launch_univtac_server.main
  python: /mnt/data/ljz/opentacbench/conda-envs/UniVTAC/bin/python
  task: bulb_tightening
  port: 8120
  host: 127.0.0.1
  observation_mode: none
  seed: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
  headless: true
  device: cuda:0
  kit_args: --/renderer/multiGpu/enabled=false --/renderer/multiGpu/maxGpuCount=1 --/renderer/multiGpu/autoEnable=false
record_video: true
use_visual_feedback: true
use_wrist_camera: false
use_img_differencing: false
use_video_differencing: false
use_oracle_code: false
use_parallel_ensemble: false
use_multimodel: false
exec_alarm_seconds: 3600
trial_timeout_seconds: 4200
process_timeout_seconds: 4800
output_dir: /mnt/data/ljz/opentacbench/cap-agent0-baselines/no_tactile
trials: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
resume_idx: ${oc.decode:${oc.env:CAPX_TASK_SEED,42000}}
num_workers: 1
